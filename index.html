<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Social Resume: The Intern Challenge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one fixed 1024×768 (4:3) game stage, letterboxed and scaled to fit any screen or projector */
:root{
  --world:#5b3fc4; --night:#2e1b5b; --cream:#fff4ea; --ink:#151c18; --coral:#c85745;
  --yellow:#ffd964; --drop:#094466; --mint:#00c49c; --pink:#fc85ff; --muted:#574a73;
  --lilac:#e8e1f5; --lilac2:#9d8fc0; --page:#1a1033; --white:#ffffff; --sky:#179cff;
  --dim:#f3ece4; --dimtext:#4a4352; --dimline:#8f8697;
  --f-pixel:'Press Start 2P','Courier New',monospace;
  --f-ui:'Pixelify Sans','Trebuchet MS',sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--page);color:var(--cream);font-family:var(--f-body)}
*,*::before,*::after{box-sizing:border-box}
#app{height:100%;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--page)}
#app:fullscreen{padding:0}
#vp{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1024px;height:768px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;
  background:var(--world) url(assets/bg-stage.png) 0 0/100% 100% no-repeat;color:var(--ink);font-family:var(--f-body)}
.pix{image-rendering:crisp-edges;image-rendering:pixelated}
.n6{clip-path:polygon(0 12px,6px 12px,6px 6px,12px 6px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 6px,calc(100% - 6px) 6px,calc(100% - 6px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 6px) calc(100% - 12px),calc(100% - 6px) calc(100% - 6px),calc(100% - 12px) calc(100% - 6px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 6px),6px calc(100% - 6px),6px calc(100% - 12px),0 calc(100% - 12px))}
.n4{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.hl{color:var(--yellow)}
.decor{position:absolute}

/* chrome */
.topbar{position:absolute;left:48px;right:48px;top:18px;height:44px;display:flex;justify-content:space-between;align-items:center;z-index:7}
.tb-left,.tb-right{display:flex;gap:12px;align-items:center}
.chip{background:rgba(46,27,91,.65);color:var(--cream);padding:8px 14px;font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:1px}
.pips{display:flex;gap:6px}
.pip{width:14px;height:14px;background:rgba(46,27,91,.65);box-shadow:inset 0 0 0 2px rgba(255,244,234,.55)}
.pip.on{background:var(--yellow);box-shadow:inset 0 0 0 2px #000}
.btn{border:0;margin:0;cursor:pointer;display:flex;gap:10px;align-items:center;font-family:var(--f-ui);font-weight:600;font-size:18px;padding:10px 16px;line-height:1}
.btn.quiet{background:rgba(46,27,91,.85);color:var(--cream)}
.btn.small{font-size:15px;padding:8px 12px;background:rgba(46,27,91,.65);color:var(--cream)}
.btn.small[aria-expanded="true"]{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 3px #000}
.btn.go{background:var(--cream);color:var(--ink);box-shadow:inset 0 0 0 3px #000}
.btn.reveal{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 3px #000;font-weight:700;font-size:20px}
.btn:focus-visible{box-shadow:inset 0 0 0 4px var(--pink)}
.btn:hover{filter:brightness(1.08)}
.btn[hidden]{display:none!important}
.tri-r{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:10px solid currentColor}
.tri-l{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:10px solid currentColor}
.bottombar{position:absolute;left:48px;right:48px;top:704px;height:44px;display:flex;justify-content:space-between;align-items:center;z-index:7}
.hint{font-family:var(--f-ui);font-weight:600;font-size:18px;color:var(--cream);background:rgba(46,27,91,.85);padding:10px 16px}
.hint:empty{visibility:hidden}
.vis-hide{visibility:hidden}

/* presenter notes: large, scrollable */
#notes{position:absolute;left:40px;right:40px;top:72px;bottom:66px;z-index:6;background:var(--night);color:var(--cream);border:6px solid #000;box-shadow:inset 0 0 0 6px var(--lilac2),0 8px 0 rgba(21,12,48,.45);padding:22px 30px 18px;display:flex;flex-direction:column;gap:10px}
#notes[hidden]{display:none}
#notes h2{margin:0;font-family:var(--f-pixel);font-size:13px;color:var(--yellow);font-weight:400;display:flex;justify-content:space-between;gap:16px}
#notes h2 span{color:var(--lilac)}
#notesBody{flex:1;min-height:0;overflow-y:auto;font-size:21px;line-height:1.5;font-weight:700;padding-right:12px}
#notesBody p{margin:0 0 12px}
#notesBody .lab{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:1px;color:var(--yellow);margin:14px 0 4px}
#notesBody .lab:first-child{margin-top:0}
#notes .keys{font-size:14px;color:var(--lilac);font-weight:700;border-top:2px dashed var(--lilac2);padding-top:8px}

/* scene */
#scene{position:absolute;inset:0}
.panel{position:absolute;left:48px;top:80px;width:928px;background:var(--cream);border:12px solid #000;box-shadow:inset 14px 14px 0 #d9d9d9,inset -14px -14px 0 #b2aaa3}
.spanel{height:410px;overflow:hidden}
.fpanel{height:584px;padding:52px 48px 26px;display:flex;flex-direction:column;gap:18px}
.fpanel.center{align-items:center;justify-content:center;text-align:center;gap:22px;padding:40px 48px}
.tags{position:absolute;left:92px;top:66px;display:flex;gap:10px;z-index:2}
.tag{padding:10px 16px;font-family:var(--f-pixel);font-size:15px;box-shadow:inset 0 0 0 4px #000;display:flex;gap:12px;align-items:center}
.t-coral{background:var(--coral);color:var(--cream)}
.t-night{background:var(--night);color:var(--cream)}
.t-mint{background:var(--mint);color:var(--ink)}
.t-yellow{background:var(--yellow);color:var(--ink);font-size:12px}
.pop{animation:pop .3s steps(4) both}
@keyframes pop{from{transform:translateY(10px);opacity:.2}to{transform:none;opacity:1}}

/* type */
.h-xl{font-family:var(--f-pixel);font-size:60px;line-height:1.1;color:var(--coral)}
.h-sub{font-family:var(--f-pixel);font-size:26px;line-height:1.3;color:var(--night)}
.h-title{font-family:var(--f-ui);font-weight:600;font-size:50px;line-height:1.15;margin-top:8px}
.ptitle{font-family:var(--f-pixel);font-size:23px;line-height:1.45;color:var(--coral);text-wrap:balance;margin:0}
.lead{font-weight:800;font-size:26px;line-height:1.35;margin:0;text-wrap:pretty}
.body{font-weight:700;font-size:22px;line-height:1.4;margin:0}
.divider{display:flex;gap:14px;align-items:center}
.dash{width:120px;height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px)}
.cite{margin-top:auto;font-weight:700;font-size:15px;color:var(--muted)}

/* big buttons */
.bigbtn{border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(7px 7px 0 var(--drop));display:block}
.bigbtn .bo{display:block;background:#000;padding:6px}
.bigbtn .bi{display:flex;gap:16px;align-items:center;background:var(--yellow);padding:18px 36px;font-family:var(--f-pixel);font-size:28px;color:var(--ink)}
.bigbtn:hover{transform:translateY(-3px)}
.bigbtn:active{transform:translateY(4px);filter:drop-shadow(3px 3px 0 var(--drop))}
.bigbtn:focus-visible{outline:4px dashed var(--yellow);outline-offset:8px}
.peek{position:absolute;left:790px;top:470px;width:140px;height:154px;object-fit:contain;object-position:bottom}

/* bullets */
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.blist li{display:flex;gap:16px;align-items:flex-start;font-weight:800;font-size:25px;line-height:1.3}
.blist li::before{content:"";flex:none;width:14px;height:14px;margin-top:9px;background:var(--coral);box-shadow:3px 3px 0 #000}
.sect{font-family:var(--f-ui);font-weight:600;font-size:22px;letter-spacing:1px;color:var(--night)}

/* white cards */
.wcard{position:relative;filter:drop-shadow(5px 5px 0 var(--drop))}
.wcard>.co{background:#000;padding:5px;height:100%}
.wcard>.co>.ci{background:var(--white);padding:18px 22px;height:100%;display:flex;flex-direction:column;gap:10px}
.wcard.hot>.co>.ci{background:var(--yellow)}
.wcard.soft>.co{background:var(--dimline)}
.wcard.soft>.co>.ci{background:var(--dim);color:var(--dimtext)}
.wcard.soft{filter:drop-shadow(5px 5px 0 #b2aaa3)}
.tight>.wcard>.co>.ci{padding:10px 16px;gap:6px}
.ck{font-family:var(--f-pixel);font-size:13px;line-height:1.5;color:var(--night)}
.ct{font-weight:800;font-size:22px;line-height:1.3}
.cs{font-weight:700;font-size:19px;line-height:1.35}
.badge{width:54px;height:54px;background:var(--world);color:var(--cream);font-family:var(--f-pixel);font-size:26px;display:flex;align-items:center;justify-content:center;flex:none}
.badge.sm{width:42px;height:42px;font-size:19px}
.hot .badge{background:#000;color:var(--yellow)}
.soft .badge{background:#b2aaa3}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.row{display:flex;gap:16px;align-items:center}
.itile{flex:none;width:58px;height:58px;background:var(--night);display:flex;align-items:center;justify-content:center}
.strip{background:var(--night);color:var(--cream);font-family:var(--f-ui);font-weight:600;font-size:24px;line-height:1.3;padding:14px 22px}
.chipx{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.5px;box-shadow:inset 0 0 0 3px #000}
.chipx.pick{background:var(--coral);color:var(--cream)}
.chipx.view{background:var(--night);color:var(--yellow)}
.chipx.no{background:var(--white);color:var(--dimtext)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* dialogue box */
.dwrap{position:absolute;left:32px;top:452px;width:960px;height:232px;z-index:3}
.dbox{position:absolute;inset:0;background:var(--night);border:6px solid #000;box-shadow:inset 0 0 0 8px var(--lilac),inset 0 0 0 12px var(--lilac2),0 8px 0 rgba(21,12,48,.45);padding:24px 40px 24px 24px;display:flex;gap:26px;align-items:center;cursor:pointer}
.dbox.noface{padding:34px 52px}
.portrait{flex:none;width:184px;height:184px;border:6px solid #000;box-shadow:inset 0 0 0 4px var(--lilac);background:var(--yellow);overflow:hidden}
.portrait img{width:172px;height:222px;object-fit:cover;object-position:top center;display:block;margin:0 auto}
.dtext{flex:1;min-width:0;color:var(--cream);font-family:var(--f-ui);font-weight:600;line-height:1.28;display:flex;flex-direction:column;gap:8px}
.dtext p{margin:0}
.nametag{position:absolute;left:236px;top:-22px;z-index:2;background:var(--yellow);box-shadow:inset 0 0 0 4px #000;padding:9px 14px;font-family:var(--f-pixel);font-size:13px;color:var(--ink)}
.nametag.left{left:28px}
.stud{position:absolute;width:20px;height:20px;background:var(--cream);border:5px solid #000}
.stud.tl{left:-6px;top:-6px}.stud.tr{right:-6px;top:-6px}.stud.bl{left:-6px;bottom:-6px}.stud.br{right:-6px;bottom:-6px}
.cue{position:absolute;right:30px;bottom:26px;width:20px;height:14px;background:var(--yellow);clip-path:polygon(0 0,100% 0,50% 100%);visibility:hidden}
.cue.on{visibility:visible;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* choices */
.choice{position:relative;display:block;width:100%;border:0;padding:0;margin:0;background:none;cursor:pointer;text-align:left;font:inherit;color:var(--ink);filter:drop-shadow(6px 6px 0 var(--drop));transition:transform .12s steps(2)}
.choice .co{display:block;height:100%;background:#000;padding:6px}
.choice .ci{display:flex;gap:16px;align-items:center;height:100%;background:var(--white);padding:16px 20px}
.choice .ci.col{flex-direction:column;align-items:stretch;gap:12px}
.ctop{display:flex;gap:14px;align-items:center}
.chead{flex:1;min-width:0;font-family:var(--f-pixel);font-size:15px;line-height:1.5;color:var(--coral)}
.ctext{font-weight:800;line-height:1.28}
.cname{font-family:var(--f-ui);font-weight:600;font-size:32px}
.cicon{flex:none;display:flex;align-items:center}
.flag{display:none;position:absolute;right:20px;top:-20px;background:var(--coral);color:var(--cream);font-family:var(--f-pixel);font-size:12px;padding:9px 11px;gap:10px;align-items:center;box-shadow:inset 0 0 0 3px #000}
.check{width:16px;height:9px;border-left:4px solid currentColor;border-bottom:4px solid currentColor;transform:rotate(-45deg) translate(1px,-2px)}
.choice:hover{transform:translateY(-3px)}
.choice:focus-visible{outline:4px dashed var(--yellow);outline-offset:6px}
.choice[aria-pressed="true"]{transform:translateY(-6px);filter:drop-shadow(8px 8px 0 var(--drop))}
.choice[aria-pressed="true"] .ci{background:var(--yellow)}
.choice[aria-pressed="true"] .badge{background:#000;color:var(--yellow)}
.choice[aria-pressed="true"] .chead{color:var(--ink)}
.choice[aria-pressed="true"] .ctext{font-weight:900}
.choice[aria-pressed="true"] .flag{display:flex}
.has-pick .choice[aria-pressed="false"]{filter:drop-shadow(6px 6px 0 #b2aaa3)}
.has-pick .choice[aria-pressed="false"] .co{background:var(--dimline)}
.has-pick .choice[aria-pressed="false"] .ci{background:var(--dim);color:var(--dimtext)}
.has-pick .choice[aria-pressed="false"] .badge{background:#b2aaa3}
.has-pick .choice[aria-pressed="false"] .chead{color:var(--dimline)}
.has-pick .choice[aria-pressed="false"] .cicon{opacity:.55}
.cgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px}
.crows{display:flex;flex-direction:column;gap:12px}
.crows .choice .ci{padding:10px 18px}
.crows .flag{top:-14px;font-size:11px;padding:7px 9px}
.qzone{position:absolute;left:96px;top:126px;width:832px;height:310px;display:flex;flex-direction:column;justify-content:center}

/* arrows (slide 5) */
.arrows{display:flex;gap:46px;justify-content:center;align-items:flex-end;flex:1;min-height:0}
.arr{display:flex;flex-direction:column;align-items:center;gap:10px}
.arr svg{display:block;shape-rendering:crispEdges}
.arr span{font-family:var(--f-ui);font-weight:700;font-size:18px;text-align:center;line-height:1.2;max-width:200px}

/* venn (slide 9) */


/* intro story pieces */
.tile{filter:drop-shadow(5px 5px 0 var(--drop))}
.tile.abs{position:absolute}
.tile .to{background:#000;padding:5px}
.tile .ti{background:var(--white);width:168px;height:156px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 8px}
.tile.sm .ti{width:150px;height:128px;gap:10px}
.t-l{font-family:var(--f-pixel);font-size:14px;line-height:1.4;color:var(--coral)}
.artrow{display:flex;gap:22px;align-items:center;justify-content:center}
.art{position:absolute;inset:0;padding-bottom:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.plus{font-family:var(--f-pixel);font-size:34px;color:var(--night)}
.stamp{font-family:var(--f-pixel);font-size:40px;color:var(--coral);border:8px dashed var(--coral);padding:18px 26px;transform:rotate(-4deg)}
.crew{display:flex;gap:26px;align-items:flex-end}
.hero{position:absolute;left:300px;top:22px;width:304px;height:390px;object-fit:contain;object-position:top center}

/* figures drawn as inline svg */
.fig{display:block;margin:0 auto;max-width:100%;height:auto}
.fig .px{font-family:var(--f-pixel)}
.fig .bd{font-family:var(--f-body);font-weight:800}


/* mini meters on choice cards */
.viz{display:flex;flex-direction:column;gap:7px;padding:10px 12px;background:#f3eefc;box-shadow:inset 0 0 0 3px #cfc4ea}
.vrow{display:flex;align-items:center;gap:12px}
.vl{width:104px;font-family:var(--f-ui);font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--night)}
.vtrack{flex:1;height:18px;position:relative;box-shadow:inset 0 0 0 3px var(--lilac2);background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(157,143,192,.25) 6px 12px)}
.vfill{position:absolute;left:0;top:0;bottom:0;box-shadow:inset 0 0 0 3px #000}
.f-users{background:var(--sky)}
.f-learn{background:var(--mint)}
.choice[aria-pressed="true"] .viz{background:#fff6cf;box-shadow:inset 0 0 0 3px #d9b93f}
.has-pick .choice[aria-pressed="false"] .viz{opacity:.55}

/* numbered step lists on choice cards */
.steplist{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:15.5px;line-height:1.22}
.steplist li::marker{font-family:var(--f-ui);font-weight:700;color:var(--coral)}
.choice[aria-pressed="true"] .steplist li::marker{color:var(--ink)}

/* placeholder */
.bigface{width:230px;height:280px;object-fit:contain;object-position:bottom center}

@media (prefers-reduced-motion:reduce){
  .pop,.cue.on{animation:none}
  .choice,.bigbtn{transition:none}
}
</style>

<div id="app">
  <div id="vp">
    <div id="stage" role="region" aria-label="Social Resume: The Intern Challenge, classroom game">
      <img class="decor pix" src="assets/star.png" alt="" style="left:4px;top:236px;width:44px;height:36px">
      <img class="decor pix" src="assets/star.png" alt="" style="left:978px;top:290px;width:44px;height:36px">
      <img class="decor pix" src="assets/star.png" alt="" style="left:160px;top:30px;width:22px;height:18px">
      <img class="decor pix" src="assets/cloud.png" alt="" style="left:-14px;top:600px;width:176px;height:80px">
      <img class="decor pix" src="assets/coin.png" alt="" style="left:934px;top:54px;width:60px;height:60px">

      <div id="scene"></div>

      <div id="notes" class="n4" hidden>
        <h2>PRESENTER NOTES <span id="notesSlide"></span></h2>
        <div id="notesBody" tabindex="0"></div>
        <div class="keys">→ / Space / Page Down: next · ← / Page Up: back · A–D: select · F: full screen · N: notes</div>
      </div>

      <div class="topbar">
        <div class="tb-left">
          <div class="chip n4" id="chip">1 / 35</div>
          <div class="pips" id="pips" aria-label="Question progress"></div>
        </div>
        <div class="tb-right">
          <button class="btn small n4" id="notesBtn" type="button" aria-expanded="false" aria-controls="notes">Notes</button>
          <button class="btn small n4" id="fsBtn" type="button">Full screen</button>
        </div>
      </div>

      <div class="bottombar">
        <button class="btn quiet n4" id="backBtn" type="button"><span class="tri-l"></span>Back</button>
        <div class="hint n4" id="hint" aria-live="polite"></div>
        <button class="btn go n4" id="nextBtn" type="button"><span id="nextLabel">Continue</span><span class="tri-r"></span></button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const A = n => 'assets/' + n + '.png';
  const FACE = { hh: A('prof-hoodie-happy'), ht: A('prof-hoodie-thinking'), sh: A('prof-suit-happy'), st: A('prof-suit-thinking'), ss: A('prof-suit-surprised'), sw: A('prof-suit-worried') };
  const FACE_ALT = { hh:'Mr. Xu in his hoodie, smiling', ht:'Mr. Xu in his hoodie, thinking', sh:'Mr. Xu, smiling', st:'Mr. Xu, thinking', ss:'Mr. Xu, surprised', sw:'Mr. Xu, worried' };
  const IC = {
    heart:[A('i-heart'),9,8], bowl:[A('i-bowl'),11,9], people:[A('i-people'),11,8], books:[A('i-books'),11,9],
    coin:[A('coin'),12,12], person:[A('i-person'),6,8], company:[A('i-company'),9,9]
  };
  function icon(k, s){ const c = IC[k]; return '<img class="pix" src="' + c[0] + '" alt="" style="width:' + (c[1]*s) + 'px;height:' + (c[2]*s) + 'px">'; }
  const CHECK = '<span class="check" aria-hidden="true"></span>';
  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const card = (inner, cls) => '<div class="wcard ' + (cls||'') + '"><div class="co n6"><div class="ci n6">' + inner + '</div></div></div>';

      + '</div></div>' + tags([['QUESTION 3 · REVEAL','t-mint']]),

    venn: () => '<div class="panel fpanel pop" style="gap:12px;align-items:center;padding-top:42px">'
      + '<div class="ptitle" style="text-align:center;font-size:21px">THE FIRM CONTROLS THE DATA, NOT THE USERS</div>'
      + vennSVG()
      + '<div class="strip n4" style="font-size:28px;text-align:center;align-self:stretch">Users can leave. <span class="hl">Data stays.</span></div>'
      + '</div>' + tags([['AUTHOR 2’S MAIN POINT','t-coral']]),

    two: () => '<div class="panel fpanel pop" style="justify-content:center;gap:30px">'
      + '<div class="ptitle">TWO ANALYSES SUPPORT THIS</div>'
      + '<div class="grid2">'
      + card('<div class="row"><span class="badge n4">1</span><span class="ck">ANALYSIS 1</span></div><div class="ct" style="font-size:30px">More data ≠ more value for users</div>')
      + card('<div class="row"><span class="badge n4">2</span><span class="ck">ANALYSIS 2</span></div><div class="ct" style="font-size:30px">Data-driven learning ≠ a network effect</div>')
      + '</div></div>' + tags([['AUTHOR 2’S MAIN POINT','t-coral']]),

    an1: () => '<div class="panel fpanel pop" style="justify-content:center;gap:30px">'
      + '<div class="ptitle">ANALYSIS 1 · TWO EXAMPLES</div>'
      + '<p class="lead" style="font-size:28px">How data can benefit a platform:</p>'
      + '<div class="grid2">'
      + card('<div class="row">' + icon('coin',4) + '<div class="ct">User-level price discrimination</div></div>')
      + card('<div class="row">' + icon('company',4) + '<div class="ct">Value capture at the expense of value creation</div></div>')
      + '</div></div>' + tags([['ANALYSIS 1','t-coral']]),

    price: () => '<div class="panel fpanel pop" style="justify-content:center;gap:26px">'
      + '<div class="ptitle">DIFFERENT USERS, DIFFERENT PRICES</div>'
      + '<div class="grid2">'
      + card('<div class="row">' + icon('person',5) + '<span class="ck">WHO YOU ARE</span></div><div class="ct" style="font-size:26px">Logins, cookies, device IDs</div>')
      + card('<div class="row">' + icon('coin',4) + '<span class="ck">WHAT YOU’LL PAY</span></div><div class="ct" style="font-size:26px">Browsing history, past purchases</div>')
      + '</div>'
      + '<div class="strip n4"><span class="hl">Example:</span> In 2012, Staples’ website charged $14.29 or $15.79 for the same stapler, depending on where you lived.</div>'
      + '</div>' + tags([['ANALYSIS 1 · EXAMPLE 1','t-coral']]),

    capture: () => '<div class="panel fpanel pop" style="gap:18px">'
      + '<div class="ptitle">THE PLATFORM EARNS MORE. USERS GET LESS.</div>'
      + '<div style="display:flex;flex-direction:column;gap:14px">'
      + card('<div class="row"><div class="itile n4">' + icon('coin',3) + '</div><div><div class="ck">ADS</div><div class="ct">More ads mean more revenue but annoyed users, and some leave.</div></div></div>')
      + card('<div class="row"><div class="itile n4">' + icon('heart',3) + '</div><div><div class="ck">BATTLEFRONT II (2017)</div><div class="ct">$80 game, about 40 hours to unlock Darth Vader unless you paid more. Backlash forced EA to cut costs by 75%.</div></div></div>')
      + '</div></div>' + tags([['ANALYSIS 1 · EXAMPLE 2','t-coral']]),

    q4: s => {
      const q = Q[s.q];
      const c = k => '<button class="choice" type="button" data-pick="' + k + '" aria-pressed="' + (picksOf(s.q).indexOf(k) >= 0) + '" aria-label="Option ' + k + ': ' + esc(q.opts[k]) + '">'
        + '<span class="co n6"><span class="ci n6"><span class="badge sm n4">' + k + '</span><span class="ctext" style="font-size:19px">' + q.opts[k] + '</span></span></span>'
        + '<span class="flag n4">' + CHECK + 'CLASS PICK</span></button>';
      return '<div class="panel spanel"></div>' + tags([['QUESTION 4','t-coral'],['SELECT ALL THAT APPLY','t-yellow']])
        + '<div class="qzone pop" style="top:118px;height:322px"><div class="crows' + (picksOf(s.q).length ? ' has-pick' : '') + '" id="choices" style="gap:10px">' + c('A') + c('B') + c('C') + c('D') + '</div></div>' + dbox(s);
    },

    q4r: s => {
      const q = Q[s.q];
      const c = k => { const on = q.view.indexOf(k) >= 0; return card('<div class="row" style="gap:12px"><span class="badge sm n4">' + k + '</span><span class="chipx ' + (on ? 'view' : 'no') + '">' + (on ? 'AUTHOR 2 AGREES' : 'AUTHOR 2 WOULDN’T SAY THIS') + '</span>' + pickChip(s.q, k) + '</div>'
        + '<div class="cs" style="font-size:17px;font-weight:800">' + q.opts[k] + '</div><div class="cs" style="font-size:17px;font-weight:600">' + q.why[k] + '</div>', on ? 'hot' : 'soft'); };
      return '<div class="panel fpanel pop" style="padding:46px 36px 22px;gap:14px">'
        + '<div class="ptitle" style="font-size:20px">AUTHOR 2’S VIEW: B AND C</div>'
        + '<div class="grid2 tight" style="gap:14px 18px">' + c('B') + c('C') + c('A') + c('D') + '</div>'
        + '</div>' + tags([['QUESTION 4 · REVEAL','t-mint']]);
    },

    an2: () => '<div class="panel fpanel pop" style="justify-content:center;gap:30px">'
      + '<div class="ptitle">ANALYSIS 2</div>'
      + '<p class="lead" style="font-size:34px;line-height:1.3">Platforms that practice <span style="color:var(--coral)">“data-driven learning”</span> do not necessarily experience a <span style="color:var(--coral)">“network effect,”</span> so the “data network effect” isn’t accurate.</p>'
      + '</div>' + tags([['ANALYSIS 2','t-coral']]),

    path: () => '<div class="panel fpanel pop" style="gap:18px">'
      + '<div class="ptitle" style="font-size:21px">DATA-DRIVEN LEARNING: PATH DEPENDENCE</div>'
      + '<div class="grid2" style="flex:1;min-height:0">'
      + card('<div class="row">' + icon('people',3) + '<span class="ck">NETWORK EFFECTS · THE PRESENT</span></div>'
        + '<div class="cs" style="font-size:20px">Network effects depend on users’ belief that there are other users on a platform to join to capture that value.</div>'
        + '<div class="cs" style="font-size:20px">There is a <b>“threshold”</b> of how many users should be on a platform to encourage users to join, creating that network effect.</div>')
      + card('<div class="row">' + icon('books',3) + '<span class="ck">DATA-DRIVEN LEARNING · THE HISTORY</span></div>'
        + '<div class="cs" style="font-size:20px">Unlike network effects, data-driven learning depends on the <b>history – not present –</b> of how much data is accumulated and insights can be made to derive value, and there is <b>no proof of a “threshold”</b> that generates more value for users.</div>', 'hot')
      + '</div></div>' + tags([['ANALYSIS 2 · REASON 1','t-coral']]),

    trade: () => '<div class="panel fpanel pop" style="gap:18px">'
      + '<div class="ptitle">DATA’S TRADABILITY</div>'
      + '<div class="grid2">'
      + card('<div class="row">' + icon('people',3) + '<span class="ck">USERS</span></div><div class="cs" style="font-size:21px">Users dropping below a certain threshold destroys the network effect. Once users leave, the firm cannot physically control the users to return.</div>')
      + card('<div class="row">' + icon('books',3) + '<span class="ck">DATA</span></div><div class="cs" style="font-size:21px">With data-driven learning, once data is collected, <b>the firm has it.</b></div>', 'hot')
      + '</div>'
      + '<div class="strip n4" style="font-size:23px">This difference in <span class="hl">autonomy</span> questions whether data can cause this network effect as people on a platform can, to justify the <span class="hl">“data network effect”</span> concept.</div>'
      + '</div>' + tags([['ANALYSIS 2 · REASON 2','t-coral']]),

    live: s => '<div class="panel fpanel center pop" style="flex-direction:row;gap:46px">'
      + '<img class="bigface" src="' + FACE.st + '" alt="Mr. Xu, thinking">'
      + '<div style="display:flex;flex-direction:column;gap:22px;align-items:flex-start;text-align:left">'
      + '<div class="ptitle" style="font-size:34px">' + s.title + '</div>'
      + '<p class="lead" style="font-size:30px;max-width:420px">Your managers will take it from here.</p>'
      + '</div></div>' + tags([['OVER TO US','t-night']]),

    strategy: () => '<div class="panel fpanel pop" style="gap:16px">'
      + '<div class="ptitle">STRATEGIC IMPLICATIONS</div>'
      + '<p class="body" style="font-size:21px">Ultimately this question of whether data can create this network effect creates two strategic implications:</p>'
      + '<div class="grid2">'
      + card('<div class="row"><span class="badge sm n4">1</span><span class="ck" style="color:var(--coral)">“GET BIG FAST”</span></div><div class="cs">If a manager thinks network effects lead to competitive advantage in a market, the goal should be to “get big fast” – more people, more value that users perceive.</div>')
      + card('<div class="row"><span class="badge sm n4">2</span><span class="ck" style="color:var(--coral)">SCALE SLOWER TO LEARN</span></div><div class="cs">If a manager thinks data-driven learning leads to competitive advantage, the goal should be to scale slower to learn about their users and gather this data.</div>')
      + '</div>'
      + '<div class="strip n4" style="font-size:20px">The term <span class="hl">“data network effects”</span> merges managers’ different priorities regarding network effects and data-driven learning into one concept, despite requiring <span class="hl">opposite strategies</span> to acquire competitive advantage.</div>'
      + '</div>' + tags([['STRATEGY','t-coral']])
  };

  const NEXT = { title:null, q1:'Reveal', q2:'Reveal', q3:'Reveal', q4:'Reveal', steps:'Reveal' };

  // ---------------- state ----------------
  let i = 0, p = 0, picks = {};
  let typing = null, spans = [];
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const sceneEl = $('scene'), stage = $('stage');

  function render(instant){
    const s = S[i];
    sceneEl.innerHTML = R[s.t](s);
    $('chip').textContent = (i + 1) + ' / ' + S.length + ' · ' + s.sec;
    const curQ = s.q ? QORDER.indexOf(qpip(s.q)) : -1;
    const lastQ = (() => { let n = -1; for (let k = 0; k <= i; k++) if (S[k].q) n = QORDER.indexOf(qpip(S[k].q)); return n; })();
    $('pips').innerHTML = QORDER.map((k, n) => '<span class="pip n4' + (n < lastQ || (n === lastQ && (curQ !== n || /r$|why$/.test(s.t))) ? ' on' : '') + '"></span>').join('');
    renderNotes(s);
    wireScene(s);
    if (s.pages) { p = Math.min(p, s.pages.length - 1); renderPage(instant); }
    updateNav();
  }

  function renderNotes(s){
    $('notesSlide').textContent = 'SLIDE ' + s.slide;
    $('notesBody').innerHTML = s.notes.map(n => (n[0] ? '<p class="lab">' + n[0] + '</p>' : '') + '<p>' + esc(n[1]) + '</p>').join('');
    $('notesBody').scrollTop = 0;
  }

  function wireScene(s){
    const sb = $('startBtn'); if (sb) sb.addEventListener('click', next);
    const db = $('dbox'); if (db) db.addEventListener('click', next);
    const ch = $('choices');
    if (ch) ch.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => pick(b.dataset.pick)));
  }

  function pick(k){
    const s = S[i]; if (!s.q || /r$|why$/.test(s.t)) return;
    const q = Q[s.q]; const keys = Object.keys(q.opts); if (keys.indexOf(k) < 0) return;
    let cur = picksOf(s.q).slice();
    if (q.multi) { const at = cur.indexOf(k); if (at >= 0) cur.splice(at, 1); else cur.push(k); cur.sort(); }
    else cur = [k];
    picks[s.q] = cur;
    const ch = $('choices');
    ch.classList.toggle('has-pick', cur.length > 0);
    ch.querySelectorAll('.choice').forEach(b => b.setAttribute('aria-pressed', String(cur.indexOf(b.dataset.pick) >= 0)));
    updateNav();
  }

  function renderPage(instant){
    const s = S[i], page = s.pages[p], d = $('dtext');
    const len = page.join(' ').replace(/\*/g, '').length;
    d.style.fontSize = (!s.face ? (len > 120 ? 28 : len > 80 ? 31 : 34) : len > 150 ? 24 : len > 105 ? 27 : 31) + 'px';
    d.innerHTML = ''; spans = [];
    page.forEach(par => {
      const el = document.createElement('p');
      par.split('*').forEach((t, k) => {
        if (!t) return;
        const sp = document.createElement('span');
        if (k % 2) sp.className = 'hl';
        el.appendChild(sp); spans.push([sp, t]);
      });
      d.appendChild(el);
    });
    $('cue').classList.remove('on');
    stopTyping();
    if (instant || reduced) { fillAll(); return; }
    let shown = 0; const total = spans.reduce((a, x) => a + x[1].length, 0);
    typing = setInterval(() => {
      shown += 2; let left = shown;
      spans.forEach(([sp, t]) => { const n = Math.max(0, Math.min(t.length, left)); sp.textContent = t.slice(0, n); left -= t.length; });
      if (shown >= total) fillAll();
    }, 22);
  }
  function stopTyping(){ if (typing) { clearInterval(typing); typing = null; } }
  function fillAll(){
    stopTyping();
    spans.forEach(([sp, t]) => { sp.textContent = t; });
    const c = $('cue'); if (c) c.classList.add('on');
    updateNav();
  }

  function updateNav(){
    const s = S[i];
    $('backBtn').classList.toggle('vis-hide', i === 0 && p === 0);
    let label = s.nx !== undefined ? s.nx : (NEXT[s.t] !== undefined ? NEXT[s.t] : 'Continue');
    if (s.pages && p < s.pages.length - 1) label = 'Continue';
    const nb = $('nextBtn');
    nb.hidden = !label;
    if (label) { $('nextLabel').textContent = label; nb.className = 'btn n4 ' + (label === 'Reveal' ? 'reveal' : 'go'); }
    let hint = '';
    if (s.q && !/r$|why$/.test(s.t)) {
      const cur = picksOf(s.q);
      hint = cur.length ? 'Class picked ' + cur.join(', ') : (Q[s.q].multi ? 'Hands up: select all that apply' : 'Hands up: which one?');
    }
    $('hint').textContent = hint;
  }

  function next(){
    const s = S[i];
    if (typing) { fillAll(); return; }
    if (s.pages && p < s.pages.length - 1) { p++; renderPage(); updateNav(); return; }
    if (i < S.length - 1) { i++; p = 0; render(); }
    else { i = 0; p = 0; picks = {}; render(); }
  }
  function back(){
    const s = S[i];
    if (typing) stopTyping();
    if (s.pages && p > 0) { p--; renderPage(true); updateNav(); return; }
    if (i > 0) { i--; const t = S[i]; p = t.pages ? t.pages.length - 1 : 0; render(true); }
  }

  // ---------------- chrome ----------------
  $('nextBtn').addEventListener('click', next);
  $('backBtn').addEventListener('click', back);
  $('notesBtn').addEventListener('click', toggleNotes);
  $('fsBtn').addEventListener('click', toggleFs);
  function toggleNotes(){
    const n = $('notes'); n.hidden = !n.hidden;
    $('notesBtn').setAttribute('aria-expanded', String(!n.hidden));
    $('notesBtn').textContent = n.hidden ? 'Notes' : 'Hide notes';
  }
  function toggleFs(){
    const app = $('app');
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (app.requestFullscreen) app.requestFullscreen().catch(() => {});
    } catch (e) {}
  }
  document.addEventListener('fullscreenchange', () => { $('fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; fit(); });

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const onButton = e.target && e.target.tagName === 'BUTTON';
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || ((k === ' ' || k === 'Enter') && !onButton)) { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); back(); }
    else if (/^[a-dA-D]$/.test(k)) pick(k.toUpperCase());
    else if (k === 'f' || k === 'F') toggleFs();
    else if (k === 'n' || k === 'N') toggleNotes();
  });

  function fit(){
    const vp = $('vp');
    const sc = Math.min(vp.clientWidth / 1024, vp.clientHeight / 768);
    stage.style.transform = 'translate(-50%,-50%) scale(' + sc + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe($('vp'));

  function start(data){
    if (data && typeof data.i === 'number') {
      i = Math.min(Math.max(0, data.i), S.length - 1);
      const raw = data.picks || {}; picks = {};
      Object.keys(raw).forEach(k => { if (Array.isArray(raw[k])) picks[k] = raw[k]; });
    }
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ v: 2, i: i, picks: picks }));
    fit();
    render(true);
  }
  function boot(data){ start(data && data.v === 2 ? data : {}); }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

</body>
</html>
